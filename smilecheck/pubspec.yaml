name: smilecheck
description: "SmileCheck app for privacy-first dental smile analysis."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  provider: ^6.1.2
  image: ^4.5.4
  tflite_flutter: ^0.12.1
  collection: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/
